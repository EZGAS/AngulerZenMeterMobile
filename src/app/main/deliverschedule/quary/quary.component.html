<div>
  <div>
    <span>員工</span>
    <nz-select style="margin: 0px 8px;" class="inputtext" [(ngModel)]="this.referencedata.employeid">
      <nz-option nzValue="00000000-0000-0000-0000-000000000000" nzLabel="請選擇"></nz-option>
      <nz-option *ngFor="let item of employees " [nzValue]="item.Id" [nzLabel]="item.Name"></nz-option>

    </nz-select>
    <span>日期</span> <nz-date-picker style="width: 120px; margin: 0px 8px;" [(ngModel)]="deliveryDate"></nz-date-picker>
    <button class="mr-4" nz-button nzType="primary" nzDanger (click)="getdeliveschedule()">查詢</button>
  </div>
</div>

<div class="container">
  <div class="row " style="overflow: auto;">
    <div class="col-4  mt-3" *ngFor=" let item of listOfData">
      <button class="mr-4" style="width: 100%;" [ngClass]="item.isSuccess ? 'isSuccess' : ''" nz-button nzType="primary"
        [routerLink]="'/main/deliverschedule/datakeyin/'+item.Id+'/'+item.userId">{{item.username}}</button>

    </div>


  </div>
</div>
